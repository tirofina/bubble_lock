[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-bubble-gateway"
version = "0.2.2"
description = "Privacy Bubble Keyring Raspberry Pi edge daemon"
requires-python = ">=3.11"
dependencies = ["bleak>=1,<4", "httpx>=0.27,<1", "paho-mqtt>=2,<3"]

[project.scripts]
bubble-gateway = "bubble_gateway.__main__:main"
bubble-keyring-journal = "bubble_gateway.journal_cli:main"
bubble-gateway-state = "bubble_gateway.state_archive:main"

[tool.setuptools.packages.find]
where = ["src"]
