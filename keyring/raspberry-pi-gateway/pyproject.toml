[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-bubble-gateway"
dynamic = ["version"]
description = "Privacy Bubble Keyring Raspberry Pi edge daemon"
requires-python = ">=3.11"
dependencies = ["bleak>=1,<4", "httpx>=0.27,<1", "paho-mqtt>=2,<3"]

[project.scripts]
bubble-gateway = "bubble_gateway.__main__:main"
bubble-keyring-journal = "bubble_gateway.journal_cli:main"
bubble-keyring-journal-compare = "bubble_gateway.journal_cli:compare_main"
bubble-keyring-reconcile = "bubble_gateway.journal_reconcile:main"
bubble-gateway-state = "bubble_gateway.state_archive:main"
bubble-keyring-ble-characterize = "bubble_gateway.ble_characterize:main"
bubble-keyring-power-evidence = "bubble_gateway.power_evidence:main"
bubble-keyring-display-evidence = "bubble_gateway.display_evidence:main"
bubble-keyring-assembly-evidence = "bubble_gateway.assembly_evidence:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "bubble_gateway.__version__"}
