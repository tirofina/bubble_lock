persistence false
log_dest stdout
per_listener_settings true
# Internal-only CSE listener; never published by Compose.
listener 1883
allow_anonymous true
# Host access requires the generated client certificate and topic ACL.
listener 8883
allow_anonymous false
cafile /mosquitto/tls/ca.pem
certfile /mosquitto/tls/server.pem
keyfile /mosquitto/tls/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.3
acl_file /mosquitto/config/keyring.acl
