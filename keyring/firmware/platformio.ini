[platformio]
default_envs = keyring_r18

[env:keyring_r18]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  https://github.com/moononournation/Arduino_GFX.git#f71dbf6532b277401d70442f43a8fa9b61c6a7e3
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
monitor_speed = 115200

; Compile-only matrices intentionally ignore local device provisioning/passkeys.
; These environments are not provisioned device firmware or permission to flash.
[env:keyring_compile_minimal]
extends = env:keyring_r18
build_flags =
  ${env:keyring_r18.build_flags}
  -D KEYRING_IGNORE_PROVISIONING=1

[env:keyring_compile_st7789]
extends = env:keyring_compile_minimal
build_flags =
  ${env:keyring_compile_minimal.build_flags}
  -D KEYRING_DISPLAY_PROFILE=1
  -D KEYRING_ENABLE_AUDIO=1
  -D KEYRING_ENABLE_SD_LOG=1
  -D KEYRING_ENABLE_SLEEP=1

[env:keyring_compile_jd9853]
extends = env:keyring_compile_minimal
build_flags =
  ${env:keyring_compile_minimal.build_flags}
  -D KEYRING_DISPLAY_PROFILE=2
  -D KEYRING_ENABLE_AUDIO=1
  -D KEYRING_ENABLE_SD_LOG=1
  -D KEYRING_ENABLE_SLEEP=1
