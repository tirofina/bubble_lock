per_listener_settings true
listener 8883
protocol mqtt
allow_anonymous false
acl_file /run/mqtt/acl
require_certificate true
use_identity_as_username true
cafile /run/mqtt/ca.pem
certfile /run/mqtt/server.pem
keyfile /run/mqtt/server.key
tls_version tlsv1.3
persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
