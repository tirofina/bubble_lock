                                                - [7.417302, 43.736479]
                                                - [7.417082, 43.736212]
                                                - [7.416868, 43.735937]
                                                - [7.416715, 43.735715]
                                                - [7.416551, 43.735538]
                                                - [7.41646, 43.735358]
                                                - [7.416365, 43.735125]
                                                - [7.416308, 43.734946]
                                                - [7.416266, 43.734679]
                                                - [7.416249, 43.734458]
