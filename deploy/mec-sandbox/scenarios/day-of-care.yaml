                                            environment: 'MEEP_LOCALITY=home-district,MEEP_SCOPE_OF_LOCALITY=MEC_HOST,MEEP_CONSUMED_LOCAL_ONLY=false'
                                            netChar:
                                                latencyDistribution: Normal
                                                throughputDl: 1000
                                                throughputUl: 1000
                                        -
                                            id: 0d0c0a00-0000-4000-8000-000000000113
