                    meta:
                        display.map.color: forestgreen
                    networkLocations:
                        -
                            id: 0d0c0a00-0000-4000-8000-000000000301
                            name: park-district-DEFAULT
                            type: DEFAULT
                            netChar:
                                latency: 1
                                latencyVariation: 1
                                throughputDl: 1000
                                throughputUl: 1000
                                packetLoss: 0
                            physicalLocations:
                                -
                                    id: 0d0c0a00-0000-4000-8000-000000000310
                                    name: mep2
                                    type: EDGE
                                    geoData:
                                        location:
                                            type: Point
                                            coordinates:
                                                - 7.414172
                                                - 43.731278
                                    meta:
                                        pb.edge: edge-b
                                        pb.capacity.cpu: '0.5'
                                        pb.capacity.memoryMi: '512'
                                    connected: true
                                    dataNetwork: {}
                                    netChar:
                                        latencyDistribution: Normal
                                        throughputDl: 1000
