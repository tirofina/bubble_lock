                                            environment: 'MEEP_MEP_COVERAGE=mep1:home-district/mep2:park-district:office-district,MEEP_SCOPE_OF_LOCALITY=MEC_SYSTEM,MEEP_CONSUMED_LOCAL_ONLY=false'
