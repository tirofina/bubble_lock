# Privacy Bubble Keyring: "day of care" scenario for the ETSI MEC Sandbox (STF_685).
# An elderly resident lives alone in Les Moneghetti (Monaco). Her keyring talks BLE to a relay phone
# (UE resident-relay); a caregiver visits in the afternoon; at dusk she walks down Boulevard de Belgique
# into Parc Princesse Antoinette, stops at a fork of the main footway and later rests on the south benches,
# where her daughter (UE guardian) joins her from an office in Fontvieille.
# Geography: OpenStreetMap (Nominatim and Overpass) coordinates, lon/lat (WGS84), rounded to 1e-6 deg.
# Topology: home-district is served by mep1 (Edge-A), park-district and office-district by mep2 (Edge-B).
# MEC013 and MEC012 on each MEP only see UEs inside that MEP's locality, so an application serving the
# resident has to follow her from mep1 to mep2. MEC021 (AMS) maps zones to MEPs for the whole system.
# The oneM2M MEC IPE (pb-ipe-mep1) is declared as an EDGE-APP on mep1; the run script adds pb-ipe-mep2 on
# mep2 through a SCENARIO-UPDATE event when it decides to relocate (see deploy/mec-sandbox/README.md).
version: 1.10.0
name: day-of-care
description: 'Privacy Bubble Keyring day of care: home (Les Moneghetti) to Parc Princesse Antoinette, two MEPs, oneM2M MEC IPE relocation'
deployment:
    netChar:
        latency: 50
        latencyVariation: 10
        latencyDistribution: Normal
        throughputDl: 1000
        throughputUl: 1000
        packetLoss: 0
    connectivity:
        model: OPEN
    d2d:
        d2dMaxDistance: 100
        disableD2dViaNetwork: false
    userMeta:
        pb-day-of-care: '{"story":"day-of-care","home":"Les Moneghetti, upper Boulevard de Belgique","park":"Parc Princesse Antoinette","office":"Fontvieille, Avenue Albert II"}'
    domains:
        -
            id: 0d0c0a00-0000-4000-8000-000000000001
            name: PUBLIC
            type: PUBLIC
            netChar:
                latency: 6
                latencyVariation: 2
                throughputDl: 1000
                throughputUl: 1000
                packetLoss: 0
            zones:
                -
                    id: 0d0c0a00-0000-4000-8000-000000000002
                    name: PUBLIC-COMMON
                    type: COMMON
                    netChar:
                        latency: 5
                        latencyVariation: 1
                        throughputDl: 1000
                        throughputUl: 1000
                        packetLoss: 0
                    networkLocations:
                        -
                            id: 0d0c0a00-0000-4000-8000-000000000003
                            name: PUBLIC-COMMON-DEFAULT
                            type: DEFAULT
                            netChar:
                                latency: 1
                                latencyVariation: 1
                                throughputDl: 1000
                                throughputUl: 1000
                                packetLoss: 0
        -
            id: 0d0c0a00-0000-4000-8000-000000000010
            name: monaco-operator
            type: OPERATOR-CELLULAR
            netChar:
                latency: 6
                latencyVariation: 2
                throughputDl: 1000
                throughputUl: 1000
                packetLoss: 0
            cellularDomainConfig:
                mnc: '001'
                mcc: '001'
                defaultCellId: FFFFFFF
            zones:
                -
                    id: 0d0c0a00-0000-4000-8000-000000000011
                    name: monaco-operator-COMMON
                    type: COMMON
                    netChar:
                        latency: 5
                        latencyVariation: 1
                        throughputDl: 1000
                        throughputUl: 1000
                        packetLoss: 0
                    networkLocations:
                        -
                            id: 0d0c0a00-0000-4000-8000-000000000012
                            name: monaco-operator-COMMON-DEFAULT
                            type: DEFAULT
                            netChar:
                                latency: 1
                                latencyVariation: 1
                                throughputDl: 1000
                                throughputUl: 1000
                                packetLoss: 0
                # Edge-A: the resident's home district (Les Moneghetti).
                -
                    id: 0d0c0a00-0000-4000-8000-000000000100
                    name: home-district
                    type: ZONE
                    netChar:
                        latency: 5
                        latencyVariation: 1
                        throughputDl: 1000
                        throughputUl: 1000
                        packetLoss: 0
                    meta:
                        display.map.color: royalblue
                    networkLocations:
                        -
                            id: 0d0c0a00-0000-4000-8000-000000000101
                            name: home-district-DEFAULT
                            type: DEFAULT
                            netChar:
                                latency: 1
                                latencyVariation: 1
                                throughputDl: 1000
                                throughputUl: 1000
                                packetLoss: 0
                            physicalLocations:
                                -
                                    id: 0d0c0a00-0000-4000-8000-000000000110
                                    name: mep1
                                    type: EDGE
                                    geoData:
                                        location:
                                            type: Point
                                            coordinates:
                                                - 7.418002
                                                - 43.736427
                                    meta:
                                        pb.edge: edge-a
                                        pb.capacity.cpu: '1.0'
                                        pb.capacity.memoryMi: '1024'
                                    connected: true
                                    dataNetwork: {}
                                    netChar:
                                        latencyDistribution: Normal
                                        throughputDl: 1000
                                        throughputUl: 1000
                                    processes:
                                        -
                                            id: 0d0c0a00-0000-4000-8000-000000000111
