                                                - 43.735937
                                        path:
                                            type: LineString
                                            coordinates:
                                                - [7.416868, 43.735937]
                                                - [7.417082, 43.736212]
                                                - [7.417302, 43.736479]
                                                - [7.417894, 43.736678]
                                                - [7.417915, 43.736945]
                                        eopMode: REVERSE
                                        velocity: 1.3
                                    connected: true
                                    wireless: true
                                    wirelessType: 'wifi,5g,4g'
                                    meta:
                                        display.map.icon: ion-android-walk
                                        pb.role: caregiver
                                    netChar:
                                        latencyDistribution: Normal
                                        throughputDl: 1000
                                        throughputUl: 1000
                                    macId: 005C0D0C0202
                # Edge-B: Parc Princesse Antoinette and the Jardin Exotique side.
