                                                - [7.416158, 43.734131]
                                                - [7.416042, 43.733948]
                                                - [7.415986, 43.733975]
                                                - [7.415907, 43.733872]
                                                - [7.41571, 43.733702]
                                                - [7.41556, 43.733582]
                                                - [7.415479, 43.733515]
                                                - [7.415336, 43.733392]
                                                - [7.415248, 43.733333]
                                                - [7.415159, 43.733293]
                                                - [7.4151, 43.733238]
                                                - [7.415052, 43.733171]
                                                - [7.414975, 43.733087]
                                                - [7.414598, 43.732772]
                                                - [7.414514, 43.732722]
                                                - [7.414478, 43.732648]
                                        eopMode: REVERSE
                                        velocity: 0.9
                                    connected: true
                                    wireless: true
                                    wirelessType: 'wifi,5g,4g'
                                    meta:
