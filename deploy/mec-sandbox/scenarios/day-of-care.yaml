                                        pb.role: resident-relay
                                    netChar:
                                        latencyDistribution: Normal
                                        throughputDl: 1000
                                        throughputUl: 1000
                                    macId: 005C0D0C0201
                        -
                            id: 0d0c0a00-0000-4000-8000-000000000130
